# Copied to <project>/.devteam/team.toml by devteam up. The project copy is the one in use.

max_agents = 4               # workers running at once, director excluded
heartbeat_minutes = 10       # how often the director is woken while it has workers
director = "director"        # role file in .devteam/roles/ used for the director, must be kind = "claude"

# Role settings live in TOML frontmatter (between +++ lines) at the top of each role file:
#   kind      agent CLI: claude or codex
#   model     passed as --model (claude) or -m (codex)
#   args      extra agent CLI arguments
#   reset     command that clears context between tasks
#   exit      command that quits the agent
#   worktree  true: runs in its own git worktree on branch devteam/<task-id>
#   when      one line telling the director when to hire this role
